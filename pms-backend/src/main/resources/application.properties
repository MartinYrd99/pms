spring.application.name=pms-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pms}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pms}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pms}
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pms}
spring.flyway.user=${SPRING_DATASOURCE_USERNAME:pms}
spring.flyway.password=${SPRING_DATASOURCE_PASSWORD:pms}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

pms.security.jwt.signing-key=${PMS_JWT_SIGNING_KEY:dev-only-jwt-signing-key-change-me-before-any-deploy}

pms.auth.refresh-cookie.secure=${PMS_AUTH_REFRESH_COOKIE_SECURE:true}

pms.payment.simulator.fail=${PMS_PAYMENT_SIMULATOR_FAIL:false}

pms.payment.settlement.enabled=${PMS_PAYMENT_SETTLEMENT_ENABLED:true}
pms.payment.settlement.fixed-delay-ms=${PMS_PAYMENT_SETTLEMENT_FIXED_DELAY_MS:2000}
pms.payment.settlement.claim-delay-ms=${PMS_PAYMENT_SETTLEMENT_CLAIM_DELAY_MS:3000}
pms.payment.settlement.max-per-run=${PMS_PAYMENT_SETTLEMENT_MAX_PER_RUN:50}
pms.payment.settlement.staleness-threshold-ms=${PMS_PAYMENT_SETTLEMENT_STALENESS_THRESHOLD_MS:60000}

pms.payment.expiry.enabled=${PMS_PAYMENT_EXPIRY_ENABLED:true}
pms.payment.expiry.fixed-delay-ms=${PMS_PAYMENT_EXPIRY_FIXED_DELAY_MS:2000}
pms.payment.expiry.age-ms=${PMS_PAYMENT_EXPIRY_AGE_MS:900000}
