spring.application.name=pms-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pms}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pms}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pms}
# Never block application startup on a database round trip; the first real query surfaces a
# connection failure instead of the boot sequence hanging or aborting.
spring.datasource.hikari.initialization-fail-timeout=-1
# Design §7: JDBC pool <= 10, this app is the sole database client.
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# No @Entity exists yet, so there is nothing for Hibernate to map or validate; building the
# EntityManagerFactory would still force a live connection purely to run that empty check
# (Hibernate always opens one for schema validation, regardless of mapped-class count). Deferring
# this auto-configuration until the first entity ships keeps ddl-auto=validate declared here as
# the contract every later ticket relies on, without requiring Postgres to be up for this one.
# MUST FLIP: delete this line in the ticket that adds the first @Entity/repository — left in place
# afterwards it silently un-autoconfigures Spring Data JPA repositories for every feature.
spring.autoconfigure.exclude=org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration

# No migration scripts exist yet (ticket 3 adds the first one under db/migration); Flyway still
# runs on every boot and simply creates its empty schema history table until then.
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pms}
spring.flyway.user=${SPRING_DATASOURCE_USERNAME:pms}
spring.flyway.password=${SPRING_DATASOURCE_PASSWORD:pms}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# The "db" indicator stays on: it pings connectivity, not schema, so it is a truthful signal even
# with no migrations yet. Do not disable it here — a broken datasource must show as DOWN.
